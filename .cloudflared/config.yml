# Cloudflare Tunnel config for QR-Tunai Drive
# Update `credentials-file` with the actual path generated by `cloudflared tunnel create`.

# Friendly tunnel name (use the one you created in Cloudflare)
tunnel: qr-tunai-drive
credentials-file: C:\Users\<USERNAME>\.cloudflared\qr-tunai-drive.json

# Ingress rules: map hostnames to local services
ingress:
  - hostname: app.adikaraproperti.site
    service: http://localhost:4000

  - hostname: drive.adikaraproperti.site
    service: http://localhost:3000

  # fallback
  - service: http_status:404
