<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Dinamis - QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow p-4 flex items-center gap-2">
    <img src="/logo.png" alt="Logo" class="h-8">
    <span class="font-bold text-lg text-blue-700">QRTunai Drive-Thru</span>
  </header>
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-xl font-semibold mb-2">Scan QR untuk Mulai Transaksi</h2>
    <div id="qr-box" class="bg-white rounded-lg shadow p-6 flex flex-col items-center">
      <img id="qr-img" src="/qr-placeholder.png" alt="QR Code" class="w-48 h-48 mb-4">
      <div id="qr-exp" class="text-gray-500 text-sm">Masa berlaku: <span id="qr-ttl">120</span> detik</div>
    </div>
    <div class="mt-6 text-gray-400 text-xs">QR akan berganti otomatis untuk keamanan.</div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="/js/qr.js"></script>
</body>
</html>
