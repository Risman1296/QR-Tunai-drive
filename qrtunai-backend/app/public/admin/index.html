<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <main class="flex-1 flex flex-col items-center justify-center p-6">

      <div class="flex justify-between">
        <span class="font-semibold">Transaksi Hari Ini</span>
        <span class="text-blue-600 font-bold">0</span>
      </div>
      <div class="flex justify-between">
        <span class="font-semibold">Antrean Aktif</span>
        <span class="text-blue-600 font-bold">0</span>
      </div>
      <div class="flex justify-between">
        <span class="font-semibold">Total Outlet</span>
        <span class="text-blue-600 font-bold">0</span>
      </div>
      <a href="/admin/transactions.html" class="mt-4 bg-blue-600 text-white rounded p-2 text-center font-semibold hover:bg-blue-700">Lihat Transaksi</a>
    </div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
