<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi - Admin QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow p-4 flex items-center gap-2">
    <img src="/logo.png" alt="Logo" class="h-8">
    <span class="font-bold text-lg text-blue-700">QRTunai Admin</span>
  </header>
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-xl font-semibold mb-2">Daftar Transaksi</h2>
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-2xl overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2">ID</th>
            <th class="p-2">Nama</th>
            <th class="p-2">Jenis</th>
            <th class="p-2">Nominal</th>
            <th class="p-2">Status</th>
            <th class="p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="trx-list">
          <tr><td colspan="6" class="text-center text-gray-400">Belum ada data</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
  <script>
    // TODO: fetch transaksi dari backend
  </script>
</body>
</html>
