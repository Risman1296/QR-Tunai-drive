<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-sm flex flex-col gap-4">
      <h2 class="text-xl font-bold mb-2 text-blue-700">Login Admin</h2>
      <form id="login-form" class="flex flex-col gap-4">
        <input type="text" name="username" class="border rounded p-2" placeholder="Username" required>
        <input type="password" name="password" class="border rounded p-2" placeholder="Password" required>
        <button type="submit" class="bg-blue-600 text-white rounded p-2 font-semibold hover:bg-blue-700">Login</button>
      </form>
      <div id="login-status" class="text-sm text-center mt-2"></div>
    </div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
  <script>
    // TODO: handle login ke backend
  </script>
</body>
</html>
