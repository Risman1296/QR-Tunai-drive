<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ - QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow p-4 flex items-center gap-2">
    <img src="/logo.png" alt="Logo" class="h-8">
    <span class="font-bold text-lg text-blue-700">QRTunai Drive-Thru</span>
  </header>
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-xl font-semibold mb-2">FAQ</h2>
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-md">
      <ul class="list-disc pl-6 text-gray-700">
        <li><b>Bagaimana cara transaksi?</b> Scan QR di outlet, isi form, tunggu status.</li>
        <li><b>Apakah aman?</b> Ya, token QR dan audit log menjamin keamanan.</li>
        <li><b>Berapa lama prosesnya?</b> Rata-rata &lt;5 menit.</li>
      </ul>
    </div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
</body>
</html>
