<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syarat & Ketentuan - QRTunai</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-white shadow p-4 flex items-center gap-2">
    <img src="/logo.png" alt="Logo" class="h-8">
    <span class="font-bold text-lg text-blue-700">QRTunai Drive-Thru</span>
  </header>
  <main class="flex-1 flex flex-col items-center justify-center p-6">
    <h2 class="text-xl font-semibold mb-2">Syarat & Ketentuan</h2>
    <div class="bg-white rounded-lg shadow p-6 w-full max-w-md text-gray-700">
      <ol class="list-decimal pl-6">
        <li>Transaksi hanya dilayani di outlet resmi QRTunai Drive-Thru.</li>
        <li>Data yang diinput wajib benar dan valid.</li>
        <li>Setiap transaksi terekam dalam audit log.</li>
        <li>QR hanya berlaku 120 detik dan tidak bisa digunakan ulang.</li>
      </ol>
    </div>
  </main>
  <footer class="bg-white text-center text-gray-400 text-sm p-4">&copy; 2025 QRTunai Drive-Thru</footer>
</body>
</html>
